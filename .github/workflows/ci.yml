---
name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  server:
    name: Language server
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pixi run bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is derived from the git history.
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          locked: true
      - name: Check code quality
        # The checks of the VSCode extension run in the client job.
        env:
          SKIP: prettier,eslint
        run: pre-commit run --all-files
      - name: Run tests
        run: pixi run test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          disable_search: true
          # Secrets are not available to pull requests from forks, but they
          # can upload without a token.
          token: ${{ secrets.CODECOV_TOKEN }}

  client:
    name: VSCode extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Compile
        run: npm run compile
      - name: Check that the extension can be packaged
        run: npm run package

  vscode:
    name: VSCode ${{ matrix.vscode-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode-version:
          - "1.93.0" # The oldest version in client/package.json.
          - stable
    defaults:
      run:
        # The extension starts the language server from the pixi environment.
        shell: pixi run bash -e {0}
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is derived from the git history.
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          locked: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Test the extension in VSCode
        env:
          VSCODE_VERSION: ${{ matrix.vscode-version }}
        run: xvfb-run -a npm test -- --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: client/coverage/lcov.info
          disable_search: true
          # Secrets are not available to pull requests from forks, but they
          # can upload without a token.
          token: ${{ secrets.CODECOV_TOKEN }}
